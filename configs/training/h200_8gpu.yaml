distributed:
  num_nodes: 1
  gpus_per_node: 8
  master_addr: 127.0.0.1
  master_port: 29500
  artifact_dir: artifacts/runs/h200_full
roles:
  learner:
    gpu_ids: [0, 1, 2, 3]
  actors:
    gpu_ids: [4, 5]
  search:
    gpu_ids: [6]
  evaluator:
    gpu_ids: [7]
stages:
  - stage0_verify
  - build_corpus
  - stage1_pretrain
  - stage2_semi_supervised
  - stage3_sft
  - stage4_robust_rl
  - stage5_adaptive
  - stage6_league
  - stage7_redteam
  - evaluate
defaults:
  n_cards: 13
  batch_size: 512
  steps: 100000
